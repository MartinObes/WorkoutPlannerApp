<main class="min-h-screen bg-slate-950 px-4 py-10">
  <section
    class="mx-auto w-full max-w-md rounded-2xl border border-slate-700 bg-slate-900 p-8 shadow-xl shadow-slate-950/50"
  >
    <h1 class="text-3xl font-bold text-white">Welcome back</h1>
    <p class="mt-2 text-sm text-slate-300">Sign in to manage workouts and evaluations.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-8 space-y-4">
      <label class="block text-sm font-medium text-slate-200">
        Email
        <input
          type="email"
          formControlName="email"
          class="mt-1 w-full rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-slate-100 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-500/20"
          placeholder="you@email.com"
        />
      </label>

      <label class="block text-sm font-medium text-slate-200">
        Password
        <input
          type="password"
          formControlName="password"
          class="mt-1 w-full rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-slate-100 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-500/20"
          placeholder="Your password"
        />
      </label>

      @if (errorMessage) {
        <p class="rounded-lg bg-rose-50 px-3 py-2 text-sm text-rose-700">{{ errorMessage }}</p>
      }

      <button
        type="submit"
        [disabled]="isSubmitting"
        class="w-full rounded-lg bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-sky-500 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ isSubmitting ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <p class="mt-6 text-sm text-slate-600">
      Don't have an account?
      <a routerLink="/create-user" class="font-semibold text-sky-300 hover:text-sky-200"
        >Create user</a
      >
    </p>
  </section>
</main>
