<aside class="flex h-screen w-72 flex-col border-r border-slate-200 bg-slate-900 text-slate-100">
  <div class="border-b border-slate-700 px-6 py-6">
    <p class="text-xs uppercase tracking-[0.2em] text-slate-400">Workout Planner</p>
    <h1 class="mt-2 text-2xl font-bold text-white">{{ username() }} Panel</h1>
  </div>

  <nav class="flex-1 px-3 py-5">
    <ul class="space-y-2">
      <li>
        <a
          [routerLink]="['/app', userId()]"
          class="group flex items-center gap-3 rounded-lg px-8 py-8 text-base font-medium text-slate-200 transition hover:bg-sky-500/20 hover:text-sky-300"
        >
          <lucide-icon [img]="dashboardIcon" class="h-7 w-7 text-sky-300"></lucide-icon>
          Dashboard
        </a>
      </li>

      <li>
        <a
          [routerLink]="['/app', userId()]"
          class="group flex items-center gap-3 rounded-lg px-8 py-8 text-base font-medium text-slate-200 transition hover:bg-emerald-500/20 hover:text-emerald-300"
        >
          <lucide-icon [img]="workoutsIcon" class="h-7 w-7 text-emerald-300"></lucide-icon>
          Workouts
        </a>
      </li>

      <li>
        <a
          [routerLink]="['/app', userId()]"
          class="group flex items-center gap-3 rounded-lg px-8 py-8 text-base font-medium text-slate-200 transition hover:bg-amber-500/20 hover:text-amber-300"
        >
          <lucide-icon [img]="evaluationsIcon" class="h-7 w-7 text-amber-300"></lucide-icon>
          Evaluations
        </a>
      </li>

      <li>
        <a
          [routerLink]="['/app', userId()]"
          class="group flex items-center gap-3 rounded-lg px-8 py-8 text-base font-medium text-slate-200 transition hover:bg-rose-500/20 hover:text-rose-300"
        >
          <lucide-icon [img]="settingsIcon" class="h-7 w-7 text-rose-300"></lucide-icon>
          Settings
        </a>
      </li>
    </ul>
  </nav>

  <div class="text-xl font-medium flex justify-center border-t border-slate-700 px-6 py-4">
    <button
      routerLink="/login"
      class="inline-flex items-center gap-3 rounded-lg px-3 py-3 transition hover:bg-sky-500/20 hover:text-sky-300"
    >
      <lucide-icon [img]="logoutIcon" class="h-7 w-7 text-slate-300"></lucide-icon>
      Logout
    </button>
  </div>
</aside>
